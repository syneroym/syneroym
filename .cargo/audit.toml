# Reader: developer. Every entry here hides an advisory from `cargo audit`.
# Each group names the crate that pulls the vulnerable code in, why it cannot
# move yet, and the condition for deleting the entries. When that condition
# is met, delete the entries; do not move them. Check this list against a
# run that ignores nothing:
#   cargo audit -f Cargo.lock   (run from a directory with no .cargo/audit.toml)

[advisories]
ignore = [
    # --- iroh 0.97 (a pre-1.0 release line, no longer supported upstream) ---
    # All of these leave with the iroh 1.x upgrade; re-check each one then.
    #
    # atomic-polyfill 1.0.3 is unmaintained. It comes from heapless 0.7, which
    # postcard's `heapless-cas` feature pulls in; iroh-relay and iroh-metrics
    # enable that feature.
    "RUSTSEC-2023-0089",
    # paste 1.0.15 is unmaintained. It is a proc-macro used by
    # netlink-packet-core, through netdev and netwatch, which iroh uses.
    "RUSTSEC-2024-0436",
    # hickory-proto 0.25.2: unbounded loop in NSEC3 validation (0118) and
    # O(n^2) name compression when encoding (0119). Through hickory-resolver,
    # which iroh 0.97 uses for DNS address lookup.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # lru 0.16.4: use-after-free if a panic happens inside
    # `LruCache::pop`-family calls. Through iroh-relay 0.97.
    "RUSTSEC-2026-0253",
    # quick-xml 0.39.4: quadratic duplicate-attribute check (0194) and
    # unbounded namespace allocation (0195). Only through object_store 0.13's
    # `aws` feature, which syneroym-data-blob leaves off by default (it is on
    # only under `--all-features`). object_store is held at 0.13 because 0.14
    # needs stable digest 0.11, which conflicts with iroh 0.97's pre-release
    # crypto pins (see the root Cargo.toml).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # --- webrtc 0.17 ---
    # crypto-bigint 0.5.5: timing variability in operations meant to be
    # constant-time. Through elliptic-curve 0.13 (p256, p384), which dtls
    # 0.17.2 uses. The fix is crypto-bigint 0.7.6+, which elliptic-curve 0.13
    # cannot use. Delete when webrtc/dtls move to a newer RustCrypto curve
    # stack.
    "RUSTSEC-2026-0387",

    # --- wasmtime's on-disk compile cache (wasmtime-internal-cache) ---
    # zstd 0.13.3 / zstd-safe 7.3.0. Every wasmtime line up to 50.0.0 still
    # requires zstd ^0.13; the fixes are in zstd 0.14.3 / zstd-safe 8.2.0.
    # We keep the cache because without it every substrate restart and every
    # test pays a full Cranelift compile per component.
    #
    # None of these code paths is reachable in our build. The cache only calls
    # the one-shot `zstd::encode_all` / `zstd::decode_all`, each on a new
    # context, and zstd-safe is built with only its `std` feature. So:
    # - 0391 (data leaks on a reused context): no context is reused.
    # - 0398, 0396 (`Seekable`): the `seekable` feature is off.
    # - 0403 (legacy frame decode): the `legacy` feature is off.
    # - 0401 (`train_from_buffer`): the `zdict_builder` feature is off.
    # - 0402, 0406 (multithreaded contexts): the `zstdmt` feature is off.
    # - 0395 (`CParameter::StableInBuffer`): the `experimental` feature is off.
    # - 0399, 0400 (dictionaries), 0404 (`DCtx::try_clone`), 0397
    #   (`OutBuffer::around_pos`), 0405 (out-of-range `InBuffer::pos`): the
    #   cache never calls these APIs and passes no hand-built buffers.
    # Delete when wasmtime-internal-cache moves to zstd 0.14.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0396",
    "RUSTSEC-2026-0397",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400",
    "RUSTSEC-2026-0401",
    "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0404",
    "RUSTSEC-2026-0405",
    "RUSTSEC-2026-0406",
]
