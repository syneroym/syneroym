name: 'CI Build and Test'
description: 'Compiles workspace and runs tests'
inputs:
  release_flag:
    description: 'Flag to pass to cargo for release mode (e.g. --release)'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    # `syneroym-test-dual-build-fixture` is a real workspace member, so its
    # component lands in the shared `target/wasm32-wasip2/`, which
    # Swatinem/rust-cache restores from a previous run keyed on Cargo.lock
    # (not on this fixture's source). A restored cache can leave Cargo's
    # fingerprints believing a stale artifact is still up to date, so the
    # dual-build parity suite ends up comparing today's native build against
    # yesterday's wasm one. Wipe this one target triple before building it
    # so the fixture is always compiled fresh, regardless of cache state.
    - name: Clean cached wasm test-fixture artifacts
      run: rm -rf target/wasm32-wasip2 target/wasm32-wasip1
      shell: bash

    - name: Build WASM Test Components
      run: |
        mise run build:test-components
      shell: bash

    - name: Check Roym Service Crate Dependency Hygiene
      run: cargo xtask check-roym-deps
      shell: bash

    - name: Run Roym Hub UI Tests
      run: mise run test:roym-ui
      shell: bash

    - name: Run Tests
      run: cargo test --workspace --all-targets --all-features ${{ inputs.release_flag }}
      shell: bash
