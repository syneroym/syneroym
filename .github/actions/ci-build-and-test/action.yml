name: 'CI Build and Test'
description: 'Builds the WASM fixtures and runs one shard of the nextest suite'
inputs:
  release_flag:
    description: 'Flag to pass to cargo for release mode (e.g. --release)'
    required: false
    default: ''
  partition:
    description: 'nextest --partition value for this shard, e.g. "slice:1/6". The default runs the whole suite.'
    required: false
    default: 'slice:1/1'
runs:
  using: "composite"
  steps:
    # `syneroym-test-dual-build-fixture` is a real workspace member, so its
    # component lands in the shared `target/wasm32-wasip2/`, which
    # Swatinem/rust-cache restores from a previous run keyed on Cargo.lock
    # (not on this fixture's source). A restored cache can leave Cargo's
    # fingerprints believing a stale artifact is still up to date, so the
    # dual-build parity suite ends up comparing today's native build against
    # yesterday's wasm one. Wipe this one target triple before building it
    # so the fixture is always compiled fresh, regardless of cache state.
    - name: Clean cached wasm test-fixture artifacts
      run: rm -rf target/wasm32-wasip2 target/wasm32-wasip1
      shell: bash

    - name: Build WASM Test Components
      run: mise run build:test-components
      shell: bash

    # `dual_build_parity` reads pre-built `target/wasm32-wasip2/release/*.wasm`
    # artifacts for all six Roym services directly off disk (see
    # `crates/roym_web/tests/dual_build_parity.rs`'s `harness`) -- nothing in
    # `cargo nextest run` triggers a `cargo component build` for them.
    - name: Build Roym WASM Components
      run: mise run build:roym
      shell: bash

    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest

    # nextest runs every test binary in one parallel pool; `--partition`
    # then keeps only this shard's slice. `.config/nextest.toml`'s
    # `substrate-e2e` group still serialises the node-booting tests within
    # the shard.
    - name: Run Tests
      run: >-
        cargo nextest run --workspace --all-features --profile ci
        --partition ${{ inputs.partition }} ${{ inputs.release_flag }}
      shell: bash
