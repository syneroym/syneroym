name: 'CI Lints, Audit & Licenses'
description: 'Runs formatting, clippy lints, security audit, and license checks'
inputs:
  github_token:
    description: 'GitHub token for audit check'
    required: true
runs:
  using: "composite"
  steps:
    - name: Check Formatting
      run: cargo fmt --all -- --check
      shell: bash

    - name: Clippy Lints
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      shell: bash

    - name: Security Audit
      uses: rustsec/audit-check@v2.0.0
      with:
        token: ${{ inputs.github_token }}

    - name: Install cargo-deny
      uses: taiki-e/install-action@cargo-deny

    - name: Check Licenses
      run: cargo deny check licenses
      shell: bash
