name: 'CI Free Disk'
description: 'Deletes large tools that the GitHub runner image ships and this repository does not use, so a full workspace build fits on the disk. Run it before the cache restore.'
runs:
  using: "composite"
  steps:
    # Each test shard builds every test binary in the workspace, which fills
    # most of the runner disk. These directories are not used by any job here.
    - name: Free disk space
      run: |
        df -h /
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL
        df -h /
      shell: bash
