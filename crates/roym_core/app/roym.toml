# Roym SynApp Manifest
# Deployed with `roymctl app deploy roym crates/roym_core/app/roym.toml --mint-masters --registry-url <url>`
# Paths are workspace-root-relative per `roymctl app deploy` artifact resolution rules.

id = "syneroym:roym"
version = "0.1.0"
description = "Roym"

[services.web]
service_type = "wasm"
source = "target/wasm32-wasip2/release/syneroym_roym_web.wasm"
interfaces = ["syneroym-roym:web/api@0.1.0"]
depends_on = ["conversation", "profile", "catalog", "transaction", "directory"]
visibility = "internal"
# In Slice C2, routes on `web` are public: true so local gateway requests
# (and unauthenticated endpoints like health) reach web without pre-gating.
# Sibling services are internal/private. Person session authentication is
# verified in application logic and fine-grained session auth gating is
# target for C4 (tracked in deferred backlog).
custom_config = '''{"http_routes":[
  {"method":"POST","path":"/rpc",   "target":"guest",    "operation":"handle-request","public":true},
  {"method":"GET", "path":"/health","target":"guest",    "operation":"handle-request","public":true},
  {"method":"GET", "path":"/ws",    "target":"websocket","operation":"handle-upgrade","public":true}
]}'''

[services.web.assets]
archive = "crates/roym_web/ui/bundle.tar.gz"
visibility = "public"

[services.web.health_check.rpc]
interface = "syneroym-roym:web/api@0.1.0"
method = "status"

[services.profile]
service_type = "wasm"
source = "target/wasm32-wasip2/release/syneroym_roym_profile.wasm"
interfaces = ["syneroym-roym:profile/api@0.1.0"]
visibility = "private"

[services.profile.health_check.rpc]
interface = "syneroym-roym:profile/api@0.1.0"
method = "status"

[services.conversation]
service_type = "wasm"
source = "target/wasm32-wasip2/release/syneroym_roym_conversation.wasm"
interfaces = ["syneroym-roym:conversation/api@0.1.0"]
visibility = "public"

[services.conversation.health_check.rpc]
interface = "syneroym-roym:conversation/api@0.1.0"
method = "status"

[services.catalog]
service_type = "wasm"
source = "target/wasm32-wasip2/release/syneroym_roym_catalog.wasm"
interfaces = ["syneroym-roym:catalog/api@0.1.0"]
visibility = "public"

[services.catalog.health_check.rpc]
interface = "syneroym-roym:catalog/api@0.1.0"
method = "status"

[services.transaction]
service_type = "wasm"
source = "target/wasm32-wasip2/release/syneroym_roym_transaction.wasm"
interfaces = ["syneroym-roym:transaction/api@0.1.0"]
visibility = "public"

[services.transaction.health_check.rpc]
interface = "syneroym-roym:transaction/api@0.1.0"
method = "status"

[services.directory]
service_type = "wasm"
source = "target/wasm32-wasip2/release/syneroym_roym_directory.wasm"
interfaces = ["syneroym-roym:directory/api@0.1.0"]
visibility = "public"
topology_visibility = "open"

[services.directory.health_check.rpc]
interface = "syneroym-roym:directory/api@0.1.0"
method = "status"
