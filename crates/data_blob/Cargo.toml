[package]
name = "syneroym-data-blob"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Off by default: it adds object_store's S3 client to the build. The
# `BlobBackend::S3` config variant exists unconditionally; selecting it
# without this feature enabled returns a clear runtime error.
aws = ["object_store/aws"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
rand.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
hkdf.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
aead = { workspace = true, features = ["stream"] }
futures.workspace = true
zeroize.workspace = true
object_store.workspace = true
bytes.workspace = true

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true

[[bench]]
name = "blob_bench"
harness = false

[lints]
workspace = true
