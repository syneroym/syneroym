[package]
name = "syneroym-wit-interfaces"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Each guest module below is a separate `wit_bindgen::generate!` invocation,
# and each one embeds a `#[used]`-anchored "component-type" custom section
# describing *its own* world -- which the linker cannot strip even when
# unreferenced, and which `wit-component` then tries to fold into whatever
# component it is asked to encode. A wasm32 consumer that pulls in every
# module unconditionally therefore carries every other module's (usually
# unsatisfied, e.g. `data-layer-guest`'s `init`/`migrate`) world requirements
# into its own component, and component encoding fails -- confirmed against
# the real toolchain, not by inspection. Default-on so every existing
# (host-only) consumer is unaffected; a wasm32 consumer must opt out of
# `default-features` and enable only the interfaces it actually imports.
default = ["app-config", "blob-store", "control-plane", "conversation", "data-layer", "http", "messaging", "proxy", "supervisor", "vault"]
app-config = []
blob-store = []
control-plane = []
conversation = []
data-layer = []
http = []
messaging = []
proxy = []
supervisor = []
vault = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
wit-bindgen.workspace = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime.workspace = true
syneroym-data-blob.workspace = true
