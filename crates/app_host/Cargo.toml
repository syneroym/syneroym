[package]
name = "syneroym-app-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Not `workspace = true`: Cargo forbids a member from narrowing a workspace
# dependency's `default-features`. `default-features = false` here on
# purpose -- this crate's guest impls (`guest.rs`) call only the eight
# interfaces `guest.rs` implements. Pulling in `syneroym-wit-interfaces`'s other
# guest modules (`control-plane`, `supervisor`) would link their unrelated,
# usually-unsatisfied worlds' component-type sections into every wasm32
# consumer of this crate -- see that crate's own `Cargo.toml` comment.
syneroym-wit-interfaces = { path = "../wit_interfaces", default-features = false, features = [
    "app-config",
    "blob-store",
    "conversation",
    "data-layer",
    "http",
    "messaging",
    "proxy",
    "vault",
] }
async-trait.workspace = true
