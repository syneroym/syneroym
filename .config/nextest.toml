# cargo-nextest configuration.
#
# nextest runs every test binary's tests in one shared parallel pool, rather
# than `cargo test`'s one-binary-at-a-time. That is the whole point -- the
# workspace has ~150 test binaries and most of the wall-clock was spent
# waiting for the next binary to start.
#
# The substrate end-to-end suite tests boot full `syneroym-substrate` nodes
# (iroh coordinator, registry, gateway, WASM sandbox). Ports are allocated
# dynamically via `common::alloc_ports`, eliminating static port collisions.
#
# Concurrency limits stem from two distinct factors:
# 1. Port binding races (`EADDRINUSE`, os error 48): a check-then-use gap
#    exists between `release_held_ports` dropping TCP probe listeners and the
#    substrate daemon binding its sockets. Under high concurrency (e.g. 8
#    threads), racing multi-node allocations collide during startup.
# 2. Kernel network memory buffer pressure (`ENOBUFS`, error 55): booting
#    many nodes concurrently risks exhausting OS mbufs.
#
# Measured runtimes for syneroym-substrate (local Apple silicon):
#   1 thread:  ~2725s (baseline)
#   2 threads: ~1369s (~2x speedup, 0 failures, 0 mbuf denials)
#   4 threads: ~680s  (~4x speedup, 0 failures, 0 mbuf denials)
#   8 threads: failed at 20s with EADDRINUSE startup port collisions
#
# Local runs use 4 threads. CI runners (2-core ubuntu-latest VMs already
# sharded 6 ways) use a conservative 2 threads to prevent contention.

[test-groups.substrate-e2e]
max-threads = 4

[test-groups.substrate-e2e-ci]
max-threads = 2

[profile.default]
# A test that has not finished in 90s is reported; one still running at
# 6 * 90s = 9min is killed (a hung node, not a slow one). Local runs do
# not retry -- a failure should be visible immediately.
slow-timeout = { period = "90s", terminate-after = 6 }

[[profile.default.overrides]]
filter = 'package(syneroym-substrate) & kind(test)'
test-group = 'substrate-e2e'

[profile.ci]
# CI shows every failure at the end again, and never stops early -- one
# flaky test should not mask the rest of the run.
fail-fast = false
failure-output = "immediate-final"

[[profile.ci.overrides]]
# The e2e suite has rare infrastructure flakes (mbuf exhaustion / ENOBUFS
# when a previous run left sockets behind). Two retries hide those without
# hiding a real regression, which fails every time.
filter = 'package(syneroym-substrate) & kind(test)'
test-group = 'substrate-e2e-ci'
retries = { backoff = "fixed", count = 2, delay = "5s" }
