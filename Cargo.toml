[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "test-components/*", "tests/perf", "xtask"]
exclude = [
    "test-components/greeter",
    "test-components/data-layer-test",
    "test-components/messaging-pubsub-test",
    "test-components/stream-test",
    "test-components/proxy-test",
    "test-components/abac-test",
    "test-components/scheduled-test",
    "test-components/saga-test",
    "test-components/http-guest-test",
    "test-components/websocket-guest-test",
    "test-components/miniapp-demo1-wasm",
]

[profile.dev]
incremental = true      # Compile your binary in smaller steps.
split-debuginfo = "unpacked" # Keep debug info out-of-line instead of duplicated into each binary; much smaller target/.
debug = "line-tables-only"  # File+line in backtraces; no variable inspection. Override in .cargo/config.local.toml for IDE debugging.

[profile.dev.package."*"]
debug = false     # Disable debug symbols for all dependencies

# Cranelift is the compiler behind every WASM component the test suite loads
# (the sandbox, every substrate e2e that deploys a service, and the
# `dual_build_parity` suite that deploys the Roym services once per test).
# Left at the dev profile's `opt-level = 0` a single component takes several
# seconds to compile; built optimized it is several times faster. These
# crates change rarely, so the one-time optimized rebuild is cached in
# `target/` like any other dependency.
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Syneroym Contributors"]
license = "MPL-2.0 OR LicenseRef-Commercial"
repository = "https://github.com/syneroym/syneroym"

[workspace.dependencies]
# Internal Workspace Crates
syneroym-core = { path = "crates/core" }
syneroym-wit-interfaces = { path = "crates/wit_interfaces" }
syneroym-rpc = { path = "crates/rpc" }
syneroym-identity = { path = "crates/identity" }
syneroym-mailbox-format = { path = "crates/mailbox_format" }
syneroym-mailbox = { path = "crates/mailbox" }
syneroym-signed-record = { path = "crates/signed_record" }
syneroym-data-keystore = { path = "crates/data_keystore" }
syneroym-app-orchestration = { path = "crates/app_orchestration" }
syneroym-app-host = { path = "crates/app_host" }
syneroym-app-host-native = { path = "crates/app_host_native" }
syneroym-sandbox-wasm = { path = "crates/sandbox_wasm" }
syneroym-data-db = { path = "crates/data_db" }
syneroym-data-blob = { path = "crates/data_blob" }
syneroym-router = { path = "crates/router" }
syneroym-observability = { path = "crates/observability" }
syneroym-community-registry = { path = "crates/community_registry" }
# Disable default-features here so that individual workspace crates (like syneroym-substrate) can opt out of default features via workspace inheritance.
syneroym-coordinator = { path = "crates/coordinator", default-features = false }
syneroym-client-gateway = { path = "crates/client_gateway" }
syneroym-coordinator-iroh = { path = "crates/coordinator_iroh" }
syneroym-coordinator-webrtc = { path = "crates/coordinator_webrtc" }
syneroym-control-plane = { path = "crates/control_plane" }
syneroym-sandbox-podman = { path = "crates/sandbox_podman" }
syneroym-sdk = { path = "crates/sdk" }
syneroym-ucan = { path = "crates/ucan" }
syneroym-passport = { path = "crates/passport" }
syneroym-fdae = { path = "crates/fdae" }
syneroym-mqtt-broker = { path = "crates/mqtt_broker" }
syneroym-chunk-transfer = { path = "crates/chunk_transfer" }
syneroym-app-supervisor = { path = "crates/app_supervisor" }
syneroym-async-queue = { path = "crates/async_queue" }
syneroym-conversation = { path = "crates/conversation" }
syneroym-auth = { path = "crates/auth" }
miniapp-demo1-web = { path = "test-components/miniapp-demo1-web" }
syneroym-test-dual-build-fixture = { path = "test-components/dual-build-fixture" }
roymctl = { path = "apps/roymctl" }
syneroym-roym-core = { path = "crates/roym_core" }
syneroym-roym-web = { path = "crates/roym_web" }
syneroym-roym-conversation = { path = "crates/roym_conversation" }
syneroym-roym-profile = { path = "crates/roym_profile" }
syneroym-roym-catalog = { path = "crates/roym_catalog" }
syneroym-roym-transaction = { path = "crates/roym_transaction" }
syneroym-roym-directory = { path = "crates/roym_directory" }

# Networking & Async
tokio = { version = "1.50", features = ["full"] }
hyper = { version = "1.10", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
http-body-util = "0.1"
bytes = "1.10"
percent-encoding = "2.3"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-service = "0.3"
tower-http = { version = "0.6", features = ["full"] }
webrtc = "0.21"
# Only for `MulticastDnsMode`, which webrtc does not re-export.
rtc = { version = "0.21", default-features = false }
# No `config` feature: it parses `askama.toml` with the unmaintained `basic-toml`,
# and this workspace has no `askama.toml`.
askama = { version = "0.16", default-features = false, features = ["derive", "std", "serde_json", "urlencode"] }
tls-parser = "0.12"
x509-parser = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` makes parsing a float give back the exact `f64` that was
# serialized. Signed JSON (message hashes, signatures) needs it: without it
# many floats change by one bit, and a signature over them fails.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "1.0"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Common / Utils
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1.12", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
metrics = "0.23"
sysinfo = "0.30"
dashmap = "6.1"
httparse = "1.10"
async-trait = "0.1"
z32 = "1.3"
blake3 = "1.8"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
hex = { version = "0.4", features = ["serde"] }
base64 = "0.23"
hpke = { version = "0.15", default-features = false, features = ["alloc", "x25519", "aes", "getrandom"] }
chrono = "0.4"
croner = "3.0"
pkarr = "8.1"
dirs = "6.0"
rusqlite = { version = "0.38", features = ["bundled-sqlcipher", "hooks"] }
sha2 = "0.10"
getrandom = "0.4"
rustls-pki-types = "1.10"
rustls = { version = "0.23", features = ["ring"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
n0-error = "1.0"
thiserror = "2.0"
aes-gcm = "0.10"
p256 = { version = "0.14", features = ["ecdh", "pkcs8", "arithmetic", "ecdsa", "getrandom"] }
rand = "0.9"
# X3DH + Double Ratchet for `syneroym:conversation`.
# Apache-2.0, matrix-org's Rust reimplementation of libolm -- license and
# API verified against the crate's own docs.rs pages before adoption, not
# from memory (`ed25519-dalek ^2.1.1` matches this workspace's own pin).
vodozemac = "0.10"
semver = "1.0"
deadpool-sqlite = "0.13"
regex = "1.10"
jsonschema = { version = "0.46", default-features = false }
hkdf = "0.12"
hmac = "0.12"
aead = "0.5"
# Used for asset-bundle unpacking (control-plane) and, pre-existing, the
# WebRTC signaling coordinator's own gzip use.
tar = "0.4"
flate2 = "1.1"
mime_guess = "2.0"
object_store = "0.14"

# Iroh dependencies
iroh-base = "1.4"
iroh = "1.4"
iroh-relay = { version = "1.4", features = ["server"] }

# WASM
# patch-pin: 48.0.0 to 48.0.6 have the aarch64 `br_table` flaw (RUSTSEC-2026-0379).
wasmtime = { version = "48.0.7", features = ["component-model", "cache"] }
wasmtime-wasi = "48.0.7" # patch-pin: same release as wasmtime.
wit-bindgen = "0.57"
wit-parser = "0.251"

# Test / Dev
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
libc = "0.2"
zeroize = { version = "1.8", features = ["derive"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
futures = "0.3"
tokio-util = "0.7"
# Embedded MQTT broker for syneroym:messaging (ADR-0010).
# 0.20 is the latest published release as of this pin (2026-07-09); no known
# conflicts with other workspace deps yet, pinned so a future `cargo update`
# doesn't silently drift the in-process router API this crate depends on (see
# crates/mqtt_broker).
# Default features pull in rustls-webpki/rustls-pemfile (vulnerable/unmaintained,
# RUSTSEC-2026-0104/0098/0099/0049, RUSTSEC-2025-0134) and a websocket stack for
# the v4/v5/ws TCP listeners; `MqttBroker` never binds any of those (see
# crates/mqtt_broker doc comment), so they're disabled entirely.
rumqttd = { version = "0.20", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
enum_glob_use = "warn"
rc_buffer = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
cognitive_complexity = "warn"
